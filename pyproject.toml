# Workspace definition. The application package lives in ./pkgs/tcord.

[project]
name = "workspace"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "maturin>=1.14,<2",
    "nuitka>=4.1.3",
    "pytest>=8",
    "pytest-asyncio>=1.5",
    "pytest-textual-snapshot>=1.1",
    "websockets>=15",
    "babel>=2.18",
    "ruff",
    "ty",
]

[tool.uv.workspace]
members = ["./pkgs/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pkgs/client/tests", "pkgs/tcord/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]

[tool.ty.environment]
python = ".venv"