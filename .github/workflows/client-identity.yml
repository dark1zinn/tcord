# Scheduled workflows run only from the default branch.
# Opening the PR with GITHUB_TOKEN needs the repository setting "Allow GitHub Actions to create
# and approve pull requests" (Settings → Actions → General). A PR opened that way triggers no
# other workflow, so the last step dispatches CI on the PR branch.
name: Client identity

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  actions: write # dispatch CI on the generated branch
  contents: write
  pull-requests: write

concurrency: client-identity

jobs:
  update:
    name: Update pinned client build number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check for a newer client build
        id: check
        run: python scripts/update_client_identity.py --check

      - name: Rewrite client identity file
        if: steps.check.outputs.changed == 'true'
        run: python scripts/update_client_identity.py --write

      - name: Open pull request
        id: pr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: chore/client-identity
          base: main
          delete-branch: true
          commit-message: "chore(core): update pinned Discord client build number to ${{ steps.check.outputs.client_build_number }}"
          title: "chore(core): update pinned Discord client build number to ${{ steps.check.outputs.client_build_number }}"
          body: |
            Automated refresh of `crates/tcord-engine/client-identity.json`.

            | Field | Old | New |
            | --- | --- | --- |
            | `client_build_number` | `${{ steps.check.outputs.previous_client_build_number }}` | `${{ steps.check.outputs.client_build_number }}` |
            | `chrome_version` | `${{ steps.check.outputs.previous_chrome_version }}` | `${{ steps.check.outputs.chrome_version }}` |

            Sources:
            - Build number: JavaScript assets referenced by https://discord.com/login
            - Chrome version: https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions
          add-paths: crates/tcord-engine/client-identity.json

      # Events caused by GITHUB_TOKEN (like opening this PR) start no workflows, except
      # workflow_dispatch: run CI on the branch so its checks show up on the PR.
      - name: Run CI on the pull request branch
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/client-identity
