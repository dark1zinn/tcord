[package]
name = "tcord-core"
version = "0.1.0"
edition = "2024"
description = "PyO3 bindings exposing the Tcord engine to Python"
license = "MIT"
publish = false

[lib]
name = "tcord_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
tcord-engine = { path = "../../crates/tcord-engine" }
