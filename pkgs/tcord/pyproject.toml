[project]
name = "tcord"
version = "0.0.1"
description = "The TUI discord client you love"
readme = "../../README.md"
authors = [
    { name = "dark1zinn", email = "dark1zinn00@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "client",
    "click>=8.4.2",
    "platformdirs>=4.3",
    "segno>=1.6",
    "tcord-core",
    "textual>=8.2.8",
    "tomli-w>=1.2",
]

[tool.uv.sources]
client = { workspace = true }
tcord-core = { workspace = true }

[project.scripts]
tcord = "tcord.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
